services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: freshgrocery-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/database
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: freshgrocery-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/database
    entrypoint: ["/bin/bash", "/database/init_db.sh"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshgrocery-backend
    restart: always
    volumes:
      - ./backend/.local:/app/.local
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=FreshGroceryDB;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=StrongPassword123!
      - SERVER_PORT=8085
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

  qdrant:
    image: qdrant/qdrant:latest
    container_name: freshgrocery-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  sqlserver_data:
  qdrant_data:
